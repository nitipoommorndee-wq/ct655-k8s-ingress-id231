# app-api : /api/<text> shows <text> in big letters at the centre of the page
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-api
  namespace: id-231
  labels:
    app: app-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app-api
  template:
    metadata:
      labels:
        app: app-api
    spec:
      containers:
        - name: app
          image: python:3.12-alpine
          command: ["python", "/app/app.py"]
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: code
              mountPath: /app
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
      volumes:
        - name: code
          configMap:
            name: app-api-code
---
apiVersion: v1
kind: Service
metadata:
  name: app-api
  namespace: id-231
spec:
  type: ClusterIP
  selector:
    app: app-api
  ports:
    - port: 80
      targetPort: 8080
